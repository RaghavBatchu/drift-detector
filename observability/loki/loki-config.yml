# ============================================================
# Loki — Log aggregation server configuration
# ============================================================
#
# Storage: local filesystem under /loki (mapped to a Docker named volume).
# Retention: 744 h (31 days). Adjust period_config or compactor.retention
# if you need longer / shorter retention.
# ============================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# ---------------------------------------------------------------------------
# Schema — use the modern TSDB store (fastest for log queries)
# ---------------------------------------------------------------------------
schema_config:
  configs:
    - from: 2024-01-01
      store:  tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# ---------------------------------------------------------------------------
# Ruler / alerting (optional — placeholder)
# ---------------------------------------------------------------------------
ruler:
  alertmanager_url: http://localhost:9093

# ---------------------------------------------------------------------------
# Compactor — handles index compaction and retention enforcement
# ---------------------------------------------------------------------------
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem

# ---------------------------------------------------------------------------
# Limits — per-tenant ingestion & query caps
# ---------------------------------------------------------------------------
limits_config:
  retention_period: 744h        # 31 days
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h

# ---------------------------------------------------------------------------
# Query range caching
# ---------------------------------------------------------------------------
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
