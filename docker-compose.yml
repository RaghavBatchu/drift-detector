# ============================================================
# Drift Detector — Docker Compose
# ============================================================
#
# Application services:
#   ai-service  → FastAPI (Python) on port 8001
#   dashboard   → Next.js (Node.js) on port 3000
#
# Observability stack:
#   prometheus  → Metrics collection          port 9090
#   loki        → Log aggregation              port 3100
#   promtail    → Log shipping agent           (no host port)
#   grafana     → Unified visualisation UI     port 3001
#
# Network:
#   All services share the "drift-net" bridge network.
#   The dashboard reaches the ai-service at http://ai-service:8001
#   (server-side only — set via FASTAPI_BASE_URL).
#
# Secrets / config:
#   Copy .env.example → .env and fill in your values.
#   The compose file reads DATABASE_URL, BETTER_AUTH_SECRET,
#   GITHUB_CLIENT_ID, and GITHUB_CLIENT_SECRET from that file.
#
# Model cache:
#   The "ai_model_cache" named volume persists the Hugging Face
#   all-MiniLM-L6-v2 weights so they aren't re-downloaded on
#   every "docker compose up".
# ============================================================

services:
  # ----------------------------------------------------------
  # AI Service — FastAPI / uvicorn
  # ----------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: drift-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Hugging Face model cache — persisted in a named volume
      HF_HOME: /root/.cache/huggingface
      # Inter-service auth
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-eB1iDCP80RbRwGQiKCrtLK_fdf348dfadf1982xfha}"
    volumes:
      # Named volume keeps the sentence-transformers model between restarts
      - ai_model_cache:/root/.cache/huggingface
    networks:
      - drift-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s # Allow time for model download on first boot

  # ----------------------------------------------------------
  # Dashboard — Next.js production server
  # ----------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Public build-time var — baked into the Next.js bundle
        NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    container_name: drift-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"

      # ---- Database ----
      DATABASE_URL: "${DATABASE_URL}"

      # ---- Better Auth ----
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      # Browser-facing URL (used by the auth SDK on the client side)
      BETTER_AUTH_URL: "http://localhost:3000"

      # ---- GitHub OAuth ----
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"

      # ---- AI Service connection (server-side only) ----
      # Uses the Docker internal hostname so server-side fetch
      # goes through the drift-net bridge — never leaves the host.
      FASTAPI_BASE_URL: "http://ai-service:8001"

      # ---- Inter-service auth ----
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:-eB1iDCP80RbRwGQiKCrtLK_fdf348dfadf1982xfha}"

      # ---- Rate limiting (Upstash Redis) ----
      UPSTASH_REDIS_REST_URL: "${UPSTASH_REDIS_REST_URL}"
      UPSTASH_REDIS_REST_TOKEN: "${UPSTASH_REDIS_REST_TOKEN}"
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - drift-net

  # ----------------------------------------------------------
  # Prometheus — metrics collection
  # Scrapes /metrics from ai-service every 15 s.
  # UI: http://localhost:9090
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: drift-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - drift-net

  # ----------------------------------------------------------
  # Loki — log aggregation
  # Receives log streams pushed by Promtail.
  # UI / API: http://localhost:3100
  # ----------------------------------------------------------
  loki:
    image: grafana/loki:2.9.5
    container_name: drift-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - drift-net

  # ----------------------------------------------------------
  # Promtail — log shipping agent
  # Tails Docker container log files from the host and ships
  # them to Loki with container-level labels.
  # Note: requires /var/lib/docker/containers to be bind-mounted
  # from the host (Docker Desktop on Windows: enable host file
  # sharing for that path, or use Docker Desktop WSL2 backend).
  # ----------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.5
    container_name: drift-promtail
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker log files — read-only on the host
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Docker socket for metadata (container name/labels)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - drift-net

  # ----------------------------------------------------------
  # Grafana — unified observability UI
  # Auto-provisions Prometheus + Loki datasources and the
  # pre-built Drift Detector dashboard on first boot.
  # UI: http://localhost:3001  (admin / admin)
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: drift-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisioning — datasources
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Provisioning — dashboard loader
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Pre-built dashboard JSON
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - drift-net

# ============================================================
# Named Volumes
# ============================================================
volumes:
  # Application
  ai_model_cache:
    driver: local

  # Observability
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  drift-net:
    driver: bridge
